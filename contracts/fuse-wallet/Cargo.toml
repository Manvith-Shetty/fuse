[package]
name = "fuse-wallet"
version = "0.1.0"
edition = "2021"
description = "Fuse: onchain policy wallet for an AI agent whose only key lives on an ESP32"
license = "MIT"
repository = "https://github.com/manvith/near-fuse-hackathon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
hex = "0.4"
bs58 = "0.5"
base64 = "0.22"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
ed25519-dalek = "3.0.0"
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
