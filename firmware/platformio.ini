; Fuse firmware. Pick the env matching the board: `pio run -e esp32dev` or `pio run -e esp32s3`.
; Flash: `pio run -e <env> -t upload`; monitor: `pio device monitor -b 115200`.

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto
    bblanchon/ArduinoJson
build_flags =
    -DFUSE_FW_VERSION=\"0.2.0\"
    -DFUSE_BAUD=115200

; classic ESP32 (WROOM-32 DevKitC / NodeMCU-32S). LED on GPIO2, BOOT on GPIO0.
[env:esp32dev]
platform = espressif32
board = esp32dev
test_ignore = test_native
build_flags = ${env.build_flags} -DFUSE_LED_PIN=2 -DFUSE_BTN_PIN=0

; ESP32-S3-DevKitC-1 (N16R8: 16 MB flash, 8 MB octal PSRAM), cable in the UART/"COM" USB-C port (CP2102).
; Onboard RGB (WS2812) on GPIO48, BOOT on GPIO0. Serial = UART0, so the bridge talks to /dev/cu.usbserial-*.
; Some clones have no working auto-download circuit: hold BOOT, tap RST, then flash with `-e esp32s3_manualboot`.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_speed = 460800
test_ignore = test_native
build_flags = ${env.build_flags} -DFUSE_RGB_PIN=48 -DFUSE_BTN_PIN=0 -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=0

; same firmware, but esptool does not try to auto-reset into the bootloader (chip already in download mode).
[env:esp32s3_manualboot]
extends = env:esp32s3
board_upload.before_reset = no_reset
board_upload.after_reset = hard_reset

; ESP32-S3 with the cable in the native "USB" port: Serial = USB CDC on the chip's own USB-JTAG device.
[env:esp32s3_usb]
extends = env:esp32s3
build_flags = ${env.build_flags} -DFUSE_RGB_PIN=48 -DFUSE_BTN_PIN=0 -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1

; host-side unit tests for the Borsh decoder and policy (no board needed): `pio test -e native`
[env:native]
platform = native
framework =
lib_deps =
    bblanchon/ArduinoJson
build_flags = -std=c++17 -DFUSE_NATIVE_TEST
test_build_src = no
